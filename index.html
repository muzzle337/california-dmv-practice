:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#14253f;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #2563eb;outline-offset:3px}main{max-width:600px;margin:0 auto;padding:20px 18px calc(28px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{font-weight:850;letter-spacing:-.03em}.logo{display:inline-flex;background:#143c7e;color:white;width:31px;height:31px;border-radius:10px;align-items:center;justify-content:center;margin-right:7px;font-size:12px}.chip{background:#e5edf9;color:#224b89;border-radius:40px;padding:7px 10px;font-size:12px;font-weight:750}.hero{background:linear-gradient(145deg,#13294d,#17477c);border-radius:25px;padding:30px 24px;color:white;box-shadow:0 16px 35px #0b2a5027}.kicker{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:850;color:#a9ceff}.hero h1{font-size:38px;line-height:1.07;letter-spacing:-.045em;margin:15px 0}.hero p{font-size:15px;line-height:1.55;color:#d8e6f8}.primary{background:#1464b9;border:0;color:white;border-radius:15px;padding:18px 20px;width:100%;font-weight:800;font-size:17px;min-height:55px}.hero .primary{background:white;color:#12335d;margin-top:13px}.secondary{background:white;border:1px solid #cfdaea;color:#15375e;border-radius:15px;padding:15px 18px;font-weight:750;width:100%;min-height:50px}.stack{display:grid;gap:12px}.section{margin-top:28px}.section h2{font-size:21px;margin:0 0 12px;letter-spacing:-.025em}.tile{background:white;border:1px solid #dde5f0;border-radius:18px;padding:18px;text-align:left;display:flex;justify-content:space-between;align-items:center;width:100%;color:#203752}.tile b{font-size:16px}.tile small{display:block;font-size:13px;color:#607087;margin-top:5px}.tile .arrow{font-size:22px;color:#6c84a1}.muted{color:#64748b;font-size:13px;line-height:1.55}.progress-wrap{height:7px;background:#dfebf8;border-radius:8px;overflow:hidden;margin-top:12px}.progress{height:100%;background:#2670ca;border-radius:8px;transition:width .25s}.exam-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.exam-head strong{font-size:14px;color:#304a70}.question{font-size:clamp(23px,5.9vw,32px);line-height:1.2;letter-spacing:-.035em;margin:29px 0 22px;font-weight:800}.answers{display:grid;gap:12px}.answer{text-align:left;background:#fff;border:2px solid #e0e7f0;border-radius:16px;padding:17px 16px;display:flex;align-items:center;gap:13px;min-height:70px;color:#172c48;font-size:16px;font-weight:650;line-height:1.35}.letter{flex-shrink:0;background:#eff4f9;border-radius:10px;width:32px;height:32px;display:grid;place-items:center;font-weight:800;color:#5d6d82}.answer.selected{border-color:#256dc4;background:#e9f3ff}.answer.correct{border-color:#22845a;background:#edfaf3}.answer.incorrect{border-color:#cb4747;background:#fff1f1}.answer[disabled]{cursor:default}.coach{margin-top:22px;padding:20px;background:#fff;border:1px solid #dce5f0;border-radius:18px}.coach h3{margin:0 0 10px;font-size:19px}.coach p{font-size:15px;line-height:1.55;color:#45566f;margin:10px 0}.steps{background:#f2f6fc;border-radius:12px;padding:15px;margin:15px 0}.steps strong{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:#365d90;margin-bottom:6px}.steps div{font-size:15px;line-height:1.45}.coach a{font-weight:700;font-size:13px}.spacer{height:16px}.summary{background:white;border:1px solid #dfe8f2;border-radius:20px;padding:24px}.big{font-size:60px;font-weight:850;letter-spacing:-.06em}.stat{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #e7edf5}.insight{background:#eaf3ff;padding:18px;border-radius:15px;line-height:1.5;font-size:14px;margin:18px 0}footer{margin:42px 0 12px;color:#7b8799;font-size:11px;line-height:1.5;text-align:center}footer a{color:#496f9e}.linkbutton{background:none;border:0;color:#35629c;text-decoration:underline;font-size:13px;padding:12px}.tag{font-size:12px;color:#43618a;font-weight:750;text-transform:uppercase;letter-spacing:.06em;margin-top:23px}.note{font-size:12px;color:#60748f;margin-top:15px}@media(min-width:500px){main{padding-top:30px}.hero h1{font-size:46px}}
</style></head><body><main id="app"></main><script>
"use strict";
const P="https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/navigating-the-roads-cont1/";
const L="https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road-cont1/";
const N="https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/navigating-the-roads/";
const S="https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/safe-driving-cont2/";
const RULES=[
{id:"space",topic:"Parallel parking",rule:"The space should be at least 3 feet longer than your car.",memory:"3 feet = extra length of the space.",think:"Is the question about the SIZE of the space, not distance to a curb or another car?",source:P,tests:[["A parallel parking spot should be how much longer than your vehicle?","At least 3 feet","At least 2 feet","At least 5 feet"],["A space is only 2 feet longer than your vehicle. What is best?","Find a space with at least 3 extra feet","Park there because 2 feet is sufficient","Leave 18 inches next to the other car"],["When choosing a parallel parking space, which measurement matters?","3 feet of extra space length","18 inches of extra space length","2 feet of extra space length"]]},
{id:"side",topic:"Parallel parking",rule:"At the start, pull alongside the vehicle in front of the space, leaving about 2 feet between the cars.",memory:"2 feet = side-to-side setup gap.",think:"Is this asking where to position your car BEFORE backing in?",source:P,tests:[["When lining up to parallel park, how far from the adjacent vehicle should you be?","About 2 feet","About 3 feet","About 5 feet"],["You are alongside the car ahead of a parallel space. Which sideways gap is correct?","About 2 feet","About 18 inches maximum from the curb","About 3 feet"],["What does the DMV's 2-foot parallel-parking measurement refer to?","The gap between the two cars while lining up","Extra space length beyond your car","The finished distance from the curb"]]},
{id:"curb",topic:"Parallel parking",rule:"Once parallel parked, the vehicle should be within 18 inches of the curb.",memory:"18 inches = finished curb gap.",think:"Look for AFTER PARKING and FROM THE CURB.",source:P,tests:[["After parallel parking, how far may you be from the curb?","Within 18 inches","Within 2 feet","Within 3 feet"],["You finish parking 24 inches from the curb. What should you do?","Move closer, to within 18 inches","Leave it, because 24 inches is acceptable","Move farther away to 3 feet"],["Which figure applies to the final distance from the curb after parallel parking?","18 inches","3 feet","2 feet"]]},
{id:"hydrant",topic:"Parking distances",rule:"Do not park within 15 feet of a fire hydrant.",memory:"Fire hydrant = 15 feet.",think:"Is it a FIRE HYDRANT? Do not mix this up with crosswalk and ramp distances.",source:P,tests:[["How close may you park to a fire hydrant?","No closer than 15 feet","No closer than 10 feet","No closer than 20 feet"],["Your car would be 12 feet from a fire hydrant. What should you do?","Find a spot at least 15 feet away","Park because 12 feet is enough","Park if you leave hazard lights on"],["Which distance applies to parking near a fire hydrant?","15 feet","3 feet","20 feet"]]},
{id:"crosswalk",topic:"Parking distances",rule:"Generally, do not park within 20 feet of any marked or unmarked crosswalk. It is 15 feet when a curb extension is present.",memory:"Crosswalk = 20 feet normally; 15 feet at a curb extension.",think:"Look for the exception: does the question mention a CURB EXTENSION?",source:P,tests:[["With no curb extension, what distance must you keep from a crosswalk when parking?","20 feet","15 feet","3 feet"],["A crosswalk has a curb extension. How close may you park?","No closer than 15 feet","No closer than 20 feet","No closer than 3 feet"],["You want to park 18 feet before an ordinary unmarked crosswalk. Is that allowed?","No, it is within 20 feet","Yes, unmarked crosswalks do not count","Yes, 15 feet is always enough"]]},
{id:"ramp",topic:"Parking distances",rule:"Do not park within 3 feet of a sidewalk ramp for disabled persons.",memory:"Sidewalk ramp = 3 feet.",think:"A ramp is not a fire hydrant or a crosswalk; identify the object first.",source:P,tests:[["How close can you park to a sidewalk ramp for disabled persons?","No closer than 3 feet","No closer than 15 feet","No closer than 20 feet"],["You are 2 feet from a sidewalk access ramp. What is true?","You are parked too close","You are outside the restricted area","The ramp rule only applies with a red curb"],["Which parking restriction uses a 3-foot distance?","A sidewalk access ramp","A fire hydrant","An ordinary crosswalk"]]},
{id:"up",topic:"Hill parking",rule:"Uphill with a curb: turn your front wheels away from the curb.",memory:"UP + CURB = AWAY.",think:"Picture the car rolling backward: the wheel should catch on the curb.",source:P,tests:[["You park uphill next to a curb. Where do you turn your wheels?","Away from the curb","Toward the curb","Straight ahead"],["On an uphill road with a curb on your right, where do the front wheels point?","To the left, away from the curb","To the right, toward the curb","Straight"],["Which wheel position is correct for uphill parking with a curb?","Turn them away from the curb","Turn them toward the curb","Keep them parallel to the curb"]]},
{id:"down",topic:"Hill parking",rule:"Downhill with a curb: turn the front wheels toward the curb.",memory:"DOWN = TOWARD curb.",think:"Imagine rolling forward downhill; the curb should stop the wheel.",source:P,tests:[["You park downhill with a curb. How should the wheels point?","Toward the curb","Away from the curb","Straight ahead"],["You face downhill; the curb is on your right. Which way do the front wheels point?","Right, toward the curb","Left, away from the curb","Straight ahead"],["Which is correct when parking downhill next to a curb?","Turn the wheels into the curb","Turn the wheels away from the curb","Leave the wheels straight"]]},
{id:"red",topic:"Curb colors",rule:"A red curb means no stopping, standing, or parking, except buses at a marked bus zone.",memory:"RED = do not stop.",think:"Ask whether even a QUICK STOP is permitted at a normal red curb.",source:P,tests:[["At a normal red curb, what may you do?","Do not stop, stand, or park","Stop briefly to pick up someone","Park for five minutes"],["Can you stop at a normal red curb for a quick passenger pickup?","No","Yes, while the engine is running","Yes, if the driver stays seated"],["What does red curb paint ordinarily prohibit?","Stopping, standing, and parking","Parking only","Only loading cargo"]]},
{id:"white",topic:"Curb colors",rule:"A white curb is for passenger pickup and drop-off for only the time needed.",memory:"WHITE = brief passenger loading.",think:"Who is loading: a passenger or cargo? Are you staying longer than necessary?",source:P,tests:[["At a white-painted curb, what is generally allowed?","Brief passenger pickup or drop-off","Parking for 15 minutes","Unloading cargo for any length of time"],["You see a white curb and your friend is waiting. What may you do?","Stop only long enough for pickup","Leave the car and go shopping","Park overnight"],["Which curb color is generally for brief passenger loading?","White","Red","Green"]]},
{id:"leftlane",topic:"Lane use",rule:"A center left-turn lane may be entered within 200 feet of making a left turn.",memory:"Center left-turn lane = 200 feet maximum before turning.",think:"Distinguish a two-way left-turn lane from a regular travel lane.",source:N,tests:[["How far before a left turn may you drive in a center left-turn lane?","No more than 200 feet","No more than 500 feet","No more than 50 feet"],["You enter a center left-turn lane 350 feet before your turn. Is that allowed?","No, enter within 200 feet","Yes, whenever the lane is clear","Yes, if the road is empty"],["The 200-foot rule applies to which action?","Using a center left-turn lane before turning","Parking beside a fire hydrant","Following a bicycle"]]},
{id:"bike",topic:"Sharing the road",rule:"When passing a bicyclist, allow at least 3 feet of clearance; when you cannot, wait until it is safe.",memory:"Passing cyclist = at least 3 feet.",think:"Safety first: if you can't leave the required space, wait.",source:N,tests:[["When passing a bicyclist, how much space must you generally leave?","At least 3 feet","At least 1 foot","At least 6 feet"],["A narrow lane makes 3 feet of passing clearance impossible. What should you do?","Wait until you can pass safely","Pass slowly with only 1 foot","Honk and squeeze by"],["Which distance is tied to passing a bicyclist in California?","3 feet","15 feet","20 feet"]]},
{id:"school",topic:"Speed rules",rule:"Within 500 feet of a school, the limit is generally 25 mph when children are outside or crossing, unless posted otherwise. Some school areas may have a 15 mph limit.",memory:"School + children = generally 25 mph; always check signs.",think:"Watch for BOTH conditions: children present and any posted limit.",source:L,tests:[["Unless signs say otherwise, what is the general limit within 500 feet of a school while children are outside?","25 mph","35 mph","45 mph"],["You see children crossing near a school and no different posted limit. What speed rule applies?","Generally 25 mph within 500 feet","35 mph in all situations","Always 15 mph statewide"],["Which extra detail could change the typical 25 mph school-area limit?","A posted lower speed limit","The driver's age","The color of the school building"]]},
{id:"highway",topic:"Speed rules",rule:"The maximum speed on most California highways is 65 mph unless otherwise posted. You must still drive safely for conditions.",memory:"Most highways = 65 mph unless signs say otherwise.",think:"A maximum limit is NOT a promise that the speed is safe in rain or traffic.",source:S,tests:[["Unless otherwise posted, what is the maximum speed on most California highways?","65 mph","55 mph","75 mph"],["The highway limit is 65 mph but traffic is moving slowly in heavy rain. What is safest?","Slow down for conditions","Stay at 65 mph because that is posted","Speed up to keep momentum"],["Which statement correctly describes a 65 mph maximum limit?","You may need to drive slower for safety","You must always drive exactly 65 mph","You may exceed it when passing"]]},
{id:"blind",topic:"Rail crossings",rule:"At railroad crossings where you cannot see the tracks for 400 feet in both directions, the limit is 15 mph within 100 feet of the crossing, unless otherwise posted.",memory:"Limited-view railroad crossing = 15 mph within 100 feet.",think:"Notice whether the question includes LIMITED VISIBILITY at the tracks.",source:L,tests:[["At a railroad crossing with a blocked view of the tracks, what speed limit may apply within 100 feet?","15 mph","25 mph","35 mph"],["You cannot see railroad tracks 400 feet in both directions as you approach. How fast may you drive within 100 feet?","No faster than 15 mph unless otherwise posted","No faster than 25 mph","No faster than 45 mph"],["Which crossing situation triggers the special 15 mph rule?","You cannot see the tracks for 400 feet both ways","A crossing has a clear view","A train passed an hour ago"]]},
{id:"emergency",topic:"Sharing the road",rule:"Do not follow within 300 feet of an emergency vehicle using its siren or flashing lights.",memory:"Emergency vehicle with lights/siren = 300 feet behind.",think:"Is the question about FOLLOWING an emergency responder, rather than yielding?",source:L,tests:[["How closely may you follow an emergency vehicle with its siren or lights in use?","No closer than 300 feet","No closer than 100 feet","No closer than 500 feet"],["An ambulance with flashing lights is ahead. You follow 150 feet behind it. Is that allowed?","No, stay at least 300 feet back","Yes, 150 feet is sufficient","Yes, if there is little traffic"],["Which distance is associated with following an active emergency vehicle?","300 feet","200 feet","15 feet"]]}
,{"id":"signal100","topic":"Signals","rule":"Signal at least 100 feet before making a turn.","memory":"TURN signal = at least 100 feet.","think":"Is this about a turn on an ordinary street? Look for how early to signal.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/introduction-to-driving/","tests":[["How far before making a turn should you signal?","At least 100 feet","At least 50 feet","At least 200 feet"],["You plan to turn right in 40 feet. When should you have started signaling?","At least 100 feet before turning","Only when you begin turning","After you slow to a stop"],["What is the ordinary minimum signal distance before a turn?","100 feet","300 feet","500 feet"]]},{"id":"signal5","topic":"Signals","rule":"Signal at least five seconds before changing lanes on a freeway.","memory":"FREEWAY lane change = 5 seconds.","think":"Is the question about a freeway lane change rather than a street turn?","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/introduction-to-driving/","tests":[["How early should you signal before a freeway lane change?","At least five seconds","At least two seconds","At least ten seconds"],["You want to move into the next lane on a freeway. Which signal timing is recommended?","Five seconds before changing lanes","Only when you start moving","One second before changing lanes"],["The DMV's five-second signaling rule refers to which maneuver?","Changing lanes on a freeway","Parking beside a curb","Turning at a stop sign"]]},{"id":"lights500","topic":"Headlights","rule":"Dim high beams within 500 feet of an oncoming vehicle.","memory":"COMING toward you = 500 feet.","think":"Distinguish an oncoming car from one traveling ahead of you.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/introduction-to-driving/","tests":[["When should you dim high beams for an approaching vehicle?","Within 500 feet","Within 300 feet","Within 100 feet"],["An oncoming vehicle is 400 feet away. What should you do with high beams?","Switch to low beams","Keep high beams until 100 feet","Flash high beams continuously"],["The 500-foot high-beam rule applies to whom?","An approaching vehicle","A vehicle you are following","A parked car"]]},{"id":"lights300","topic":"Headlights","rule":"Dim high beams within 300 feet of a vehicle you are following.","memory":"FOLLOWING a car = 300 feet.","think":"Does the other car face you or travel in the same direction?","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/introduction-to-driving/","tests":[["How close may you follow a car with your high beams on?","Dim them within 300 feet","Dim them within 100 feet","Dim them within 500 feet"],["You are 200 feet behind another car at night. Which headlights are appropriate?","Low beams","High beams","Parking lights only"],["The 300-foot high-beam distance is for which situation?","Following another vehicle","Approaching an oncoming vehicle","Parking on a hill"]]},{"id":"wipers","topic":"Headlights","rule":"Turn on low-beam headlights when you must use windshield wipers because of rain, fog, or snow.","memory":"Wipers needed = low beams on.","think":"Look for weather that requires windshield wipers.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/introduction-to-driving/","tests":[["It begins raining and you must use windshield wipers. What lights should you turn on?","Low-beam headlights","Only parking lights","Only emergency flashers"],["In fog requiring windshield wipers, what should you do?","Use low-beam headlights","Use high beams only","Turn all lights off"],["When wipers are required due to rain, fog, or snow, which lighting rule applies?","Turn on low-beam headlights","Turn on interior lights","Use parking lights alone"]]},{"id":"following3","topic":"Following distance","rule":"Use the three-second rule to maintain a safe following distance in normal conditions.","memory":"Follow = at least 3 seconds in normal conditions.","think":"Think about how much reaction time you need, not a fixed number of feet.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/safe-driving/","tests":[["What following-distance rule does the DMV recommend in normal driving?","Three seconds","One second","Six inches"],["You pass a roadside marker two seconds after the car ahead. What should you do?","Increase the gap","Move closer to one second","Stay at two seconds"],["How can you check a reasonable normal following distance?","Count three seconds after the car ahead passes a marker","Keep exactly 15 feet","Watch only your speedometer"]]},{"id":"scan10","topic":"Hazard awareness","rule":"Scan the road at least 10 seconds ahead so you can react early.","memory":"Scan ahead = at least 10 seconds.","think":"Look for how far AHEAD you should visually plan.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/safe-driving/","tests":[["How far ahead should you scan while driving?","At least 10 seconds","At least 2 seconds","At least 30 seconds"],["To avoid last-second moves, where should you keep looking?","At least 10 seconds down the road","Only at the car directly ahead","Only in the rearview mirror"],["The DMV's 10-second rule is about what?","Looking ahead for hazards","Following another car","Signaling before turning"]]},{"id":"blindspot","topic":"Blind spots","rule":"Check your blind spot by looking over your shoulder before changing lanes.","memory":"MIRRORS do not show every blind spot.","think":"Ask what your mirror cannot reveal before moving sideways.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/safe-driving/","tests":[["Before changing lanes, how should you check for a vehicle in your blind spot?","Look over your shoulder","Rely on mirrors alone","Only look straight ahead"],["Your side mirrors look clear before merging. What should you do next?","Check over your shoulder","Change lanes immediately","Close your eyes briefly"],["Which action helps detect a car hidden just behind your side window?","A shoulder check","Using only the rearview mirror","Looking at the dashboard"]]},{"id":"roundabout","topic":"Right-of-way","rule":"When entering a roundabout, yield to traffic already circulating inside.","memory":"Already IN the circle goes first.","think":"Does the other vehicle already occupy the roundabout?","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road/","tests":[["Who has the right-of-way when you enter a roundabout?","Vehicles already in the roundabout","Vehicles entering the roundabout","The largest vehicle always"],["You approach a roundabout and a car is circulating inside. What should you do?","Yield and enter when safe","Enter first because you are on the right","Stop inside the circle"],["Which driver normally yields at a roundabout?","The driver entering","The driver already circulating","The driver closest to an exit"]]},{"id":"round-direction","topic":"Roundabouts","rule":"Travel counterclockwise around a roundabout and do not stop or pass inside.","memory":"Roundabout = counterclockwise flow.","think":"Watch for the direction of travel inside the circle.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road/","tests":[["Which direction does traffic move through a California roundabout?","Counterclockwise","Clockwise","Either direction"],["You miss your exit at a roundabout. What should you do?","Continue around to the exit again","Stop and reverse","Make a U-turn inside the circle"],["What is the safe action if you miss the intended roundabout exit?","Continue circulating until the exit returns","Back up immediately","Stop in the circulating lane"]]},{"id":"crosswalk-yield","topic":"Pedestrians","rule":"Yield to pedestrians in marked and unmarked crosswalks.","memory":"Unmarked crosswalk still counts.","think":"The road might not have painted crosswalk lines.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road/","tests":[["At an unmarked crosswalk, a pedestrian is crossing. What should you do?","Yield and allow them to cross","Continue because no lines are painted","Honk so they hurry"],["What is true about pedestrians at a crosswalk without painted lines?","They still have the right-of-way","They must always wait for vehicles","They may cross only with a police officer"],["You approach an intersection and see someone walking across an unmarked crosswalk. What is safest?","Reduce speed or stop to yield","Maintain speed and pass close by","Drive around them quickly"]]},{"id":"stoppedcross","topic":"Pedestrians","rule":"Do not pass a vehicle that is stopped at a crosswalk; it may be blocking your view of a pedestrian.","memory":"Stopped at crosswalk? Do not pass.","think":"Ask WHY the car ahead has stopped.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road/","tests":[["A car ahead is stopped at a crosswalk. What should you do?","Do not pass it","Pass on the right shoulder","Honk and pass"],["Why must you not pass a car stopped at a crosswalk?","A pedestrian may be hidden in front of it","Passing is allowed if you use a turn signal","The car might be waiting to park"],["A vehicle is stopped just before a marked crosswalk. Which action is safest?","Stop rather than drive around it","Speed around it if no pedestrian is visible","Use the opposite lane to pass"]]},{"id":"blindped","topic":"Pedestrians","rule":"A pedestrian with a white cane or guide dog has the right-of-way; do not honk at a blind pedestrian.","memory":"White cane / guide dog = extra caution.","think":"Notice indicators that a pedestrian may be blind.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road/","tests":[["A pedestrian with a white cane is preparing to cross. What should you do?","Yield and be extra cautious","Honk to signal that you are there","Drive past quickly"],["Which pedestrian requires particular caution because they may rely on sound?","One using a guide dog or white cane","One wearing a baseball cap","One wearing sunglasses only"],["Should you honk at a blind pedestrian to tell them to cross?","No, do not honk","Yes, always","Only while turning left"]]},{"id":"merge","topic":"Freeway merging","rule":"Traffic already on the highway has the right-of-way. Enter at or near traffic speed when safe.","memory":"MERGING traffic yields.","think":"Ask who is already traveling in the highway lane.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/navigating-the-roads/","tests":[["While merging onto a freeway, who generally has the right-of-way?","Traffic already on the freeway","The entering vehicle","The vehicle with the louder horn"],["You are entering a freeway using an on-ramp. What should you do?","Match traffic speed when safe and merge into a gap","Stop at the end of the ramp every time","Force freeway traffic to brake"],["What is the best approach to entering a highway?","Yield to traffic there and merge safely","Enter at any speed regardless of traffic","Assume cars must move for you"]]},{"id":"leftrd","topic":"Red-light turns","rule":"A left turn on red is allowed only from a one-way street onto a one-way street, unless prohibited; yield first.","memory":"LEFT on red = one-way TO one-way.","think":"Check BOTH streets' directions before considering this exception.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/navigating-the-roads/","tests":[["When may you turn left on a red light in California?","From a one-way street onto a one-way street, if not prohibited and safe","From any two-way street","From a one-way street onto any two-way street"],["You are on a one-way street turning left onto another one-way street at a red light, with no prohibition sign. What should you do?","Yield and turn only when safe","Turn without stopping or checking","Never turn left on red in any circumstance"],["Which street combination may permit a left turn at a red light?","One-way to one-way","Two-way to two-way","One-way to two-way"]]},{"id":"uvisibility","topic":"U-turns","rule":"Never make a U-turn where you cannot see clearly for 200 feet in both directions.","memory":"U-turn sight distance = 200 feet EACH way.","think":"Does the question mention visibility rather than how many lanes?","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/navigating-the-roads/","tests":[["You cannot see 200 feet in both directions. May you make a U-turn?","No","Yes, if you signal","Yes, if you stop first"],["You want to make a U-turn near a curve with poor visibility. What should you do?","Find a place with clear sight for 200 feet each way","Turn immediately with your hazard lights on","Use the horn while turning"],["The DMV's 200-foot visibility rule is important for which maneuver?","Making a U-turn","Parking next to a hydrant","Setting high beams"]]},{"id":"uoneway","topic":"U-turns","rule":"Do not make a U-turn on a one-way street.","memory":"ONE-WAY street = no U-turn.","think":"The street direction controls whether the maneuver is legal.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/navigating-the-roads/","tests":[["Is it legal to make a U-turn on a one-way street?","No","Yes, if there is no traffic","Yes, only at night"],["You miss a business on a one-way street. What should you avoid doing?","Making a U-turn","Continuing around the block","Turning at a legal intersection"],["Which street type prohibits U-turns?","A one-way street","A residential street with clear 200-foot visibility","An intersection permitting U-turns"]]},{"id":"schoolbus","topic":"School buses","rule":"When a school bus flashes red lights, stop until the red lights stop and children are safely across, subject to divided/multilane roadway exceptions.","memory":"School bus RED = STOP.","think":"Check whether the road has two or more lanes in each direction or a physical divider.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road-cont1/","tests":[["A school bus ahead flashes its red lights on a two-lane road. What should you do?","Stop until lights stop and children are safe","Pass slowly at 15 mph","Continue if no child is visible"],["On an undivided two-lane road, a school bus stops across from you with red lights flashing. What should you do?","Stop","Continue at the posted speed","Honk and pass"],["When may you proceed after stopping for a school bus with flashing red lights?","When red lights stop and children are safely across","As soon as you no longer see children","After counting three seconds"]]},{"id":"schoolbus-except","topic":"School buses","rule":"You do not need to stop for a school bus on the opposite side of a divided or multilane highway with at least two lanes in each direction.","memory":"Opposite side of divided/multilane highway = exception.","think":"Inspect the exact road layout, not just the school bus lights.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road-cont1/","tests":[["A school bus has red flashing lights on the opposite side of a divided highway. What must you do?","You do not need to stop for that bus","Always stop on both sides of every divided highway","Cross the median and stop"],["A bus is across a roadway with two lanes in each direction, flashing red lights. Does the opposite-direction driver have to stop for that bus?","No","Yes, even on this multilane highway","Only if driving a truck"],["Which situation is an exception to stopping for a bus with red lights?","A bus on the opposite side of a divided highway","A bus ahead on a two-lane street","A bus opposite you on a two-lane undivided road"]]},{"id":"alley15","topic":"Speed limits","rule":"The speed limit in an alley is 15 mph unless signs state otherwise.","memory":"ALLEY = 15 mph.","think":"Identify the type of road; this isn't a residential through street.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road-cont1/","tests":[["What is the California speed limit in an alley?","15 mph","25 mph","35 mph"],["You enter an alley behind shops. What maximum speed typically applies?","15 mph","30 mph","45 mph"],["Which roadway is associated with a 15 mph speed limit?","An alley","Most freeways","A typical open highway"]]},{"id":"blind15","topic":"Speed limits","rule":"The speed limit at a blind intersection is 15 mph when your view is blocked and the intersection meets the blind-intersection definition.","memory":"Blind intersection = 15 mph.","think":"Can you see cross traffic clearly? Check whether the intersection is blind.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road-cont1/","tests":[["What speed limit applies at a blind intersection?","15 mph","25 mph","35 mph"],["Your view of an intersection is blocked and it qualifies as a blind intersection. What is the speed limit?","15 mph","40 mph","55 mph"],["Which situation is linked to the 15 mph intersection rule?","A blind intersection","A clearly visible signalized intersection","An interstate freeway"]]},{"id":"rails-stop","topic":"Railroads","rule":"When railroad crossing lights flash red, stop and wait until they stop flashing, even if the gate has risen.","memory":"Flashing railroad RED means WAIT.","think":"A raised gate does not cancel flashing red lights.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road-cont1/","tests":[["A railroad gate rises but the red lights still flash. What should you do?","Stay stopped","Cross because the gate is up","Cross if no train is visible"],["What indicates you must remain stopped at a railroad crossing?","Flashing red warning lights","A gate that has fully risen","A clear view of the tracks"],["When can you cross after railroad crossing signals activate?","After red lights stop flashing and it is safe","Whenever the gate starts moving upward","After honking twice"]]},{"id":"rails15","topic":"Railroads","rule":"When warned a train is coming, stop at least 15 feet from the nearest railroad track.","memory":"Railroad stop = at least 15 feet from track.","think":"Measure from the NEAREST track, not from a road sign.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road-cont1/","tests":[["A train is approaching and the crossing warns you to stop. How far from the track should you stop?","At least 15 feet","At least 3 feet","At least 5 feet"],["You stop 8 feet from the nearest railroad track when a train is coming. Is that enough?","No, stay at least 15 feet back","Yes, 8 feet is enough","Yes, if you use hazard lights"],["The 15-foot minimum stopping distance applies to which situation?","A warned railroad crossing","Parallel parking by the curb","Approaching a freeway exit"]]},{"id":"bus10","topic":"Buses and trolleys","rule":"You may pass a bus, streetcar, or trolley stopped at a safety zone or traffic light at no more than 10 mph, when passing is allowed.","memory":"Stopped trolley at safety zone = max 10 mph.","think":"Watch for the vehicle type and whether it is stopped at a safety zone.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road-cont1/","tests":[["When lawfully passing a trolley stopped at a safety zone, what maximum speed applies?","10 mph","15 mph","25 mph"],["A streetcar is stopped at a designated safety zone and you are permitted to pass. What speed is the maximum?","10 mph","20 mph","30 mph"],["The 10 mph passing limit applies to which situation?","A stopped bus or trolley at a safety zone or signal","Passing a car on the freeway","Driving through a school zone"]]},{"id":"truck-wide","topic":"Large vehicles","rule":"A large truck may swing left before turning right; do not squeeze into the space beside it.","memory":"Truck swings wide = don't slip alongside.","think":"A truck's initial movement may not show its final turn direction.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road-cont1/","tests":[["A large truck signals right but swings left. What is safest?","Stay back and allow room for its right turn","Pass on its right","Pull beside its trailer"],["Why should you avoid the right side of a truck making a wide right turn?","Its rear wheels can cut across your path","The truck is required to stop before turning","The truck must yield to anyone beside it"],["A truck ahead swings left while signaling a right turn. What should you anticipate?","It may be making a wide right turn","It is changing lanes left","It is giving permission to pass on its right"]]},{"id":"motorcycle","topic":"Motorcycles","rule":"Give motorcyclists a safe three-second following distance; never pass a motorcycle within the same lane.","memory":"Motorcycles get a full lane.","think":"A motorcycle may need to swerve around hazards.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road-cont1/","tests":[["When following a motorcyclist, what minimum time gap is recommended in normal conditions?","Three seconds","One second","Half a second"],["A motorcycle is ahead in your lane. May you squeeze past it within that same lane?","No","Yes, if the motorcycle stays near the shoulder","Yes, if you honk"],["How should you treat a motorcycle's lane space?","Give the motorcycle the full lane","Share the lane while passing","Pass it without changing lanes"]]},{"id":"bike-lane200","topic":"Bike lanes","rule":"Enter a bicycle lane no more than 200 feet before making a turn, and only when safe.","memory":"Bike-lane entry before turn = 200 feet maximum.","think":"A bike lane can be crossed for a turn only under the permitted conditions.","source":"https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/laws-and-rules-of-the-road-cont1/","tests":[["How far before a right turn may you enter a bike lane?","No more than 200 feet","No more than 500 feet","No more than 50 feet"],["You intend to turn right in 300 feet. When should you enter the bike lane, if safe?","Wait until within 200 feet of the turn","Merge into it now at 300 feet","Never enter it to make a turn"],["Which distance limits how far you may drive in a bike lane before turning?","200 feet","15 feet","500 feet"]]}];
const VERSION="2026-11-17";let state={view:"home",mode:"coach",items:[],idx:0,chosen:null,answered:false,wrong:[],correct:0,start:Date.now()};
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getStats(){try{return JSON.parse(localStorage.getItem("dmv-coach-progress")||'{"attempts":0,"answers":0,"correct":0,"misses":{}}')}catch{return {attempts:0,answers:0,correct:0,misses:{}}}}
function saveStats(s){try{localStorage.setItem("dmv-coach-progress",JSON.stringify(s))}catch{}}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
const el=()=>document.getElementById("app");
function topbar(extra=""){return '<div class="top"><div class="brand"><span class="logo">CA</span>DMV Coach</div><span class="chip">'+extra+'</span></div>'}
function footer(){return '<footer>Independent study tool • Not affiliated with California DMV<br><a target="_blank" rel="noopener" href="https://www.dmv.ca.gov/portal/handbook/california-driver-handbook/">Official California Driver’s Handbook</a> · <span>Content reviewed '+VERSION+'</span></footer>'}
function home(){const st=getStats();const misses=Object.values(st.misses||{}).reduce((a,b)=>a+b,0);el().innerHTML=topbar("Mobile-first practice")+
'<section class="hero"><div class="kicker">California knowledge test</div><h1>Learn the rule.<br>Not just the answer.</h1><p>Realistic questions, new wording, and short coaching that teaches you what to look for next time.</p><button class="primary" id="start">Start practicing →</button></section>'+
'<section class="section"><h2>Choose how to practice</h2><div class="stack"><button class="tile" id="quick"><span><b>Quick coaching · 10 questions</b><small>Instant feedback after every answer</small></span><span class="arrow">›</span></button><button class="tile" id="exam"><span><b>Mock exam · 35 questions</b><small>Answers at the end, like a test</small></span><span class="arrow">›</span></button><button class="tile" id="missed"><span><b>Practice my weak spots</b><small>'+misses+' misses saved on this iPhone/browser</small></span><span class="arrow">›</span></button></div></section>'+
'<section class="section"><h2>Your practice</h2><p class="muted">'+st.attempts+' completed sessions · '+st.answers+' answers · '+(st.answers?Math.round(100*st.correct/st.answers):0)+'% overall accuracy</p></section>'+
'<p class="note">Questions are original practice scenarios based on DMV handbook rules, not copies of the live DMV exam. Mock exam length is for training, not an official test specification.</p>'+footer();
document.getElementById("start").onclick=()=>begin("coach");document.getElementById("quick").onclick=()=>begin("coach");document.getElementById("exam").onclick=()=>begin("exam");document.getElementById("missed").onclick=()=>begin("missed")}
function makeItem(r,n){const t=r.tests[n%r.tests.length];let opts=shuffle(t.slice(1));return {rule:r,question:t[0],answer:t[1],options:opts}}
function begin(mode){const st=getStats();let pool=RULES;if(mode==="missed"){pool=RULES.filter(x=>(st.misses||{})[x.id]>0);if(!pool.length){alert("No missed rules yet. Start a coaching round first.");return}pool=pool.sort((a,b)=>((st.misses||{})[b.id]||0)-((st.misses||{})[a.id]||0))}
const items=[];const count=mode==="exam"?35:mode==="coach"?10:Math.min(15,pool.length*3);let offset=Math.floor(Math.random()*3);
for(let round=0;items.length<count;round++){for(const rule of shuffle(pool)){if(items.length===count)break;items.push(makeItem(rule,(round+offset)%3))}}
state={view:"quiz",mode,items,idx:0,chosen:null,answered:false,wrong:[],correct:0,start:Date.now()};renderQuiz()}
function renderQuiz(){const q=state.items[state.idx];const pct=100*state.idx/state.items.length;const display=state.idx+1;const visible=state.answered&&state.mode!=="exam";
el().innerHTML=topbar(state.mode==="exam"?"Mock exam":state.mode==="missed"?"Weak-spot practice":"Coaching mode")+
'<div class="exam-head"><strong>Question '+display+' of '+state.items.length+'</strong><button class="linkbutton" id="quit">Exit</button></div><div class="progress-wrap"><div class="progress" style="width:'+pct+'%"></div></div>'+
'<div class="tag">'+escapeHtml(q.rule.topic)+'</div><h1 class="question">'+escapeHtml(q.question)+'</h1><div class="answers">'+q.options.map((o,i)=>{let c="answer";if(state.chosen===o)c+=" selected";if(visible&&o===q.answer)c+=" correct";if(visible&&state.chosen===o&&o!==q.answer)c+=" incorrect";return '<button class="'+c+'" data-idx="'+i+'" '+(state.answered?"disabled":"")+'><span class="letter">'+("ABC"[i])+'</span><span>'+escapeHtml(o)+'</span></button>'}).join("")+'</div>'+
(state.answered?'<div class="coach"><h3>'+(state.chosen===q.answer?"✓ That’s right":"Not quite — here’s the rule")+'</h3><p><b>'+escapeHtml(q.rule.rule)+'</b></p><div class="steps"><strong>How to think about it</strong><div>'+escapeHtml(q.rule.think)+'</div></div><p><b>Remember:</b> '+escapeHtml(q.rule.memory)+'</p><a target="_blank" rel="noopener" href="'+q.rule.source+'">Read this rule in the DMV handbook ↗</a></div><div class="spacer"></div><button class="primary" id="next">'+(display===state.items.length?"See my results →":"Next question →")+'</button>':
'<p class="muted" style="margin-top:25px">'+(state.mode==="exam"?"No feedback until you finish the mock exam.":"Pick the best answer. We’ll explain the rule afterward.")+'</p>')+
footer();
document.getElementById("quit").onclick=()=>{if(confirm("Leave this round and return home?")){state.view="home";home()}};
if(!state.answered)document.querySelectorAll("[data-idx]").forEach(b=>b.onclick=()=>submit(q.options[Number(b.dataset.idx)]));
else document.getElementById("next").onclick=next;
}
function submit(choice){if(state.answered)return;const q=state.items[state.idx];state.chosen=choice;state.answered=true;const correct=choice===q.answer;if(correct)state.correct++;else state.wrong.push({id:q.rule.id,topic:q.rule.topic,question:q.question,choice,answer:q.answer,rule:q.rule.rule,think:q.rule.think});
const st=getStats();st.answers++;if(correct)st.correct++;else st.misses[q.rule.id]=(st.misses[q.rule.id]||0)+1;saveStats(st);
if(state.mode==="exam"){state.answered=false;state.idx++;state.chosen=null;if(state.idx>=state.items.length){finish();return}renderQuiz();return}renderQuiz()}
function next(){state.idx++;state.answered=false;state.chosen=null;if(state.idx>=state.items.length)finish();else renderQuiz()}
function finish(){const st=getStats();st.attempts++;saveStats(st);state.view="results";const total=state.items.length;const percent=Math.round(100*state.correct/total);
el().innerHTML=topbar("Round complete")+'<section class="summary"><div class="kicker" style="color:#4f73a0">Your results</div><div class="big">'+state.correct+'/'+total+'</div><div class="muted">'+percent+'% correct</div><div class="progress-wrap"><div class="progress" style="width:'+percent+'%"></div></div><div class="stat"><span>Correct answers</span><b>'+state.correct+'</b></div><div class="stat"><span>Rules to review</span><b>'+state.wrong.length+'</b></div><div class="insight">'+(state.wrong.length?"Don't just remember the correct choice. Look at the clue in the question that points to the right rule. Then try the same rule with different wording.":"Great work. Keep practicing with other wording before taking the real test.")+'</div></section>'+
(state.wrong.length?'<section class="section"><h2>What to review</h2><div class="stack">'+state.wrong.map(w=>'<div class="coach" style="margin-top:0"><b>'+escapeHtml(w.topic)+'</b><p>'+escapeHtml(w.question)+'</p><p><b>Correct:</b> '+escapeHtml(w.answer)+'</p><div class="steps"><strong>Think this way</strong>'+escapeHtml(w.think)+'</div></div>').join("")+'</div></section>':"")+
'<section class="section stack"><button class="primary" id="again">Another coaching round →</button><button class="secondary" id="weak">Practice my missed rules</button><button class="secondary" id="home">Back to home</button></section>'+footer();
document.getElementById("again").onclick=()=>begin("coach");document.getElementById("weak").onclick=()=>begin("missed");document.getElementById("home").onclick=home}
home();
</script></body></html>
